apiVersion: v1
kind: Namespace
metadata:
  name: k8-cluster-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8-cluster-control
  namespace: k8-cluster-control
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8-cluster-control
  namespace: k8-cluster-control
data:
  KUBE_CONTEXT: in-cluster
  CLUSTER_NAME: in-cluster
  CLUSTER_REGION: local
  CLUSTER_DESCRIPTION: Kubernetes cluster hosting this command console.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8-cluster-control
  namespace: k8-cluster-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8-cluster-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8-cluster-control
    spec:
      serviceAccountName: k8-cluster-control
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: k8-cluster-control:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: k8-cluster-control
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: k8-cluster-control
  namespace: k8-cluster-control
spec:
  selector:
    app.kubernetes.io/name: k8-cluster-control
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8-cluster-control
  namespace: k8-cluster-control
spec:
  rules:
    - host: k8-control.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8-cluster-control
                port:
                  name: http